# Do not use a student-editable workflow as the sole final grading authority.
name: Semana 09 - Seguridad y privacidad

on:
  push:
    branches: [pwa-week-09]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Setup 1
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: AC-01 - Instalación limpia y build completan.
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json && (test -f package-lock.json || test -f pnpm-lock.yaml || test -f yarn.lock) && npm run build --if-present
      - name: AC-02 - Los artefactos declarados para la actividad existen.
        shell: bash
        run: |
          set -euo pipefail
          test -e 'docs/threat-model.md' && test -e 'docs/privacy-data-inventory.md' && test -e 'src/lib/security/' && test -e 'tests/security.spec.ts' && test -e 'public/robots.txt'
      - name: AC-03 - Existe una suite ejecutable de pruebas.
        shell: bash
        run: |
          set -euo pipefail
          test -d tests && find tests -type f -print -quit | grep -q . && npm run test --if-present -- --run
      - name: Verificación completa y reporte reproducible
        if: ${{ !cancelled() }}
        run: npm run verify
      - name: AC-04 - Documentación y evidencia presentes
        if: ${{ !cancelled() }}
        run: test -s README.md && test -s evidence/individual.md
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week09-verification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            evaluation-result.json
            coverage/
            test-results/
            reports/verification.json
            reports/week09/
            reports/week08/
            playwright-report/
